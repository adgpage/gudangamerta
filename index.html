<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sistem Manajemen Gudang</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gudang ADG">

  <style>
    body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-family:'Segoe UI',sans-serif;background:#f8fafc;}
    img{width:90px;margin-bottom:20px;}
    .loader{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;
            animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <img src="./icon-192.png" alt="Logo">
  <div class="loader"></div>

  <script>
    // GANTI dengan URL /exec aplikasi GAS Anda yang SUDAH ADA (tidak diubah sama sekali)
    const GAS_APP_URL = "https://script.google.com/macros/s/AKfycbyvPdgXfQLPXwE8fy1AyTDuYQIoD2HLBmmnFNexdxQRjVRZ1DMUpDseITUVXrpxsoo11Q/exec";

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    // Full navigation (BUKAN iframe) -> tidak kena blokir X-Frame-Options DEFAULT
    window.location.replace(GAS_APP_URL);
  </script>
</body>
</html>
